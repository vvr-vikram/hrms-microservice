server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
    banner-mode: off

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5000}/hrms_employee_db
    username: postgres
    password: ${DB_PASSWORD:1254}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-Employee

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        use_sql_comments: true
    show-sql: true
    open-in-view: false

  jackson:
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Kolkata
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [TraceId: %X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.hrms: DEBUG
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG

app:
  employee:
    employee-code-prefix: "EMP"
    employee-code-length: 8
    default-password: "Welcome@123"

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
